<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Clack</title>
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; background: #141414; color: #eee; margin: 2rem; max-width: 40rem; }
    code { color: #ccc; }
    #out { white-space: pre-wrap; }
  </style>
</head>
<body>
  <p>This page uses the same Clack core as the desktop app. The browser build does not run Whisper. <code>SpeechModel</code> is the extension point, and there is no second engine.</p>
  <p id="out">Loading…</p>
  <script type="module">
    const out = document.querySelector("#out");
    try {
      const mod = await import("./pkg/clack_wasm.js");
      await mod.default();
      const repo = mod.normalizeModelRef("https://hf.co/openai/whisper-tiny/tree/main/");
      let session = "no session";
      try {
        const clack = new mod.Clack(repo, "auto");
        session = clack.transcript();
      } catch (err) {
        session = String(err);
      }
      out.textContent = `normalized: ${repo}\n${session}\n\nA Web Audio microphone would resample to 16 kHz and call pushAudio. That call needs a session, and this build does not create one.`;
    } catch (err) {
      out.textContent = `The wasm package is not built yet (${err}).\nFrom the workspace: wasm-pack build crates/clack-wasm --target web --out-dir ../../web/pkg\nWhisper stays behind SpeechModel. The package does not ship a fake recognizer.`;
    }
  </script>
</body>
</html>
