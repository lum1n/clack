[package]
name = "clack-core"
version = "0.1.0"
edition = "2021"
description = "Embeddable speech-to-text core for Clack"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["whisper", "microphone"]
whisper = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:hf-hub",
    "dep:tokenizers",
    "dep:rustfft",
]
microphone = ["dep:cpal"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"

candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
hf-hub = { version = "1.0", optional = true, features = ["blocking"] }
tokenizers = { version = "0.21", optional = true }
rustfft = { version = "6", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.18", optional = true }
